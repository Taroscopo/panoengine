# Despliegue automático del VISOR a STAGING — orden PARTE B.2.
# Se dispara SOLO cuando CI termina en verde en un push a main (workflow_run).
# Despliega únicamente apps/edge-viewer con `--config wrangler.staging.jsonc`
# (Worker panoengine-edge-viewer-staging + bucket panoengine-tours-staging).
# El wrangler.produccion.jsonc NO se usa en ningún paso de este workflow.
# Este despliegue NO sube tours: los tours se publican desde el estudio local
# con el botón «Publicar» (publisher R2).
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

# Un solo despliegue a la vez; los demás esperan en cola (no se cancelan).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy (visor → staging)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout (SHA exacto que pasó CI)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Instalar pnpm 12.14.0
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Instalar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile
      # build:viewer = vite build → dist-viewer. NO se ejecuta `pnpm build`
      # completo aquí porque su último paso es un dry-run contra el config de
      # producción (wrangler.produccion.jsonc), vetado en este workflow.
      - name: Construir el visor
        run: pnpm --filter @panoengine/edge-viewer build:viewer
      - name: Desplegar Worker del visor a staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @panoengine/edge-viewer exec wrangler deploy \
            --config wrangler.staging.jsonc 2>&1 | tee wrangler-deploy.log
          url="$(grep -Eo 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' wrangler-deploy.log | head -n 1 || true)"
          if [ -z "$url" ]; then
            echo 'No se encontró la URL de *.workers.dev en la salida de wrangler' >&2
            exit 1
          fi
          echo "STAGING_URL=$url" >> "$GITHUB_ENV"
      # Smoke mínimo que NO depende de tours subidos (orden B.4).
      # La batería completa (402/410, Range 206, ETag/304) sigue siendo A2.
      # Cabeceras verificadas hoy: Content-Type text/html y Cache-Control
      # no-store (el Worker aún no emite X-Content-Type-Options etc.; señalizado
      # en auditoria/INFORME.md).
      - name: Smoke mínimo contra staging
        run: |
          set -eu
          echo "1/2 healthz → 200 con cuerpo del servicio"
          codigo="$(curl -sS -o /tmp/healthz.json -w '%{http_code}' "$STAGING_URL/healthz")"
          [ "$codigo" = "200" ] || { echo "healthz: se esperaba 200 y llegó $codigo" >&2; exit 1; }
          grep -q 'panoengine-edge-viewer' /tmp/healthz.json || { echo 'healthz: cuerpo inesperado' >&2; exit 1; }
          echo "2/2 tour inexistente → 404 HTML sin caché (sin cuerpo de tour)"
          codigo="$(curl -sS -o /tmp/no-tour.html -D /tmp/no-tour.headers -w '%{http_code}' "$STAGING_URL/tours/smoke-no-existe")"
          [ "$codigo" = "404" ] || { echo "tour inexistente: se esperaba 404 y llegó $codigo" >&2; exit 1; }
          grep -qi '^content-type: text/html' /tmp/no-tour.headers || { echo 'falta Content-Type: text/html' >&2; exit 1; }
          grep -qi '^cache-control: no-store' /tmp/no-tour.headers || { echo 'falta Cache-Control: no-store' >&2; exit 1; }
          grep -qi '^x-content-type-options: nosniff' /tmp/no-tour.headers || { echo 'falta X-Content-Type-Options: nosniff (H1)' >&2; exit 1; }
          echo 'Smoke de staging OK'
