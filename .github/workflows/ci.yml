# CI de PanoEngine — orden PARTE B.1.
# Corre en cada push a main y en cada pull request.
# Sin credenciales de Cloudflare: `pnpm verify` termina con
# `wrangler deploy --dry-run` (valida y empaqueta; no sube nada).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: pnpm verify (typecheck + tests + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # El repo no declara `packageManager` ni `.nvmrc`: se fijan las versiones
      # del entorno de desarrollo (Node 24.19.0, pnpm 12.14.0; engines node >=22).
      - name: Instalar pnpm 12.14.0
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Instalar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile
      - name: pnpm verify
        run: pnpm verify
